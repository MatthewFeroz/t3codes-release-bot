name: Triage replies

# Replies to @t3codes mentions that say T3 Code is broken, pointing to
# `npx t3 triage`. X only allows API replies to posts that mention or quote
# @t3codes, so this reads the mention timeline. Scheduled runs do nothing
# until the REPLY_MODE repository variable is set to queue or auto.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run prints what it would send. queue records matches for approval. auto replies within the caps.'
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - queue
          - auto
      approve:
        description: 'Queued mention post IDs to reply to now, comma-separated'
        required: false
        default: ''
        type: string
      reject:
        description: 'Queued mention post IDs never to reply to, comma-separated'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Shared with the nightly poster: both commit .bot-state to main.
concurrency:
  group: t3codes-publisher
  cancel-in-progress: false

jobs:
  reply:
    if: github.event_name == 'workflow_dispatch' || vars.REPLY_MODE == 'queue' || vars.REPLY_MODE == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reply to mentions
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BOT_DATA_DIR: ${{ github.workspace }}/.bot-state
          REPLY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.REPLY_MODE }}
          REPLY_APPROVE: ${{ inputs.approve }}
          REPLY_REJECT: ${{ inputs.reject }}
          BOT_REMOTE_STATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && '0' || '1' }}
        run: python replies.py run
