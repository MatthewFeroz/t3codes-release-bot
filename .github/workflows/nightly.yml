name: Nightly release posts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t3codes-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish only unseen nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
          X_VAULT_KEY: ${{ secrets.X_VAULT_KEY }}
          BOT_DATA_DIR: ${{ github.workspace }}/.bot-state
          BOT_REMOTE_STATE: '1'
        run: python bot.py run
      - name: Verify X credentials on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          X_VAULT_KEY: ${{ secrets.X_VAULT_KEY }}
          BOT_DATA_DIR: ${{ github.workspace }}/.bot-state
          BOT_REMOTE_STATE: '1'
        run: python -c "from bot import X; X().verify(); print('Verified @t3codes credentials')"
