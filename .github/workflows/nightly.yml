name: Nightly release posts

# Nightlies are published on pingdotgg/t3code, not in this repository, so a
# release event here never fires. Poll that repo's release list instead.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the nightly text and do not call X'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: t3codes-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Post new nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BOT_DATA_DIR: ${{ github.workspace }}/.bot-state
          BOT_REMOTE_STATE: ${{ inputs.dry_run == true && '0' || '1' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          X_MAX_POST_CHARS: ${{ vars.X_MAX_POST_CHARS }}
        run: python bot.py run
